version: "3.8"

services:

  app:

    build: .

    container_name: app_movies

    restart: always

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  mysql:

    image: mysql:8.0

    container_name: mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: app_movies

      MYSQL_USER: user_movies

      MYSQL_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:

      PMA_HOST: mysql

      PMA_PORT: 3306

      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

volumes:

  mysql_data: